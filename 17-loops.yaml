- name: Install and remove packages using loop
  hosts: localhost
  become: yes
  tasks: 
  - name: Install and remove packages
    ansible.builtin.dnf:
      name: "{{ item.name }}"
      state: "{{ item.state}}"
    loop:
    - {name: 'mysql', state: 'absent'}
    - {name: 'nginx', state: 'latest'}
    - {name: 'postfix', state: 'latest'}