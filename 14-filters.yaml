- name: Default value
  hosts: localhost
  tasks:
  - name: Print default value
    ansible.builtin.debug:
      msg: "Hello {{course | default('Ansible')}}"

- name: Convert to Uppercase
  hosts: localhost
  vars:
    greeting: Hello, Good Morning!
  tasks:
  - name: Convert to Uppercase
    ansible.builtin.debug:
      msg: "{{greeting | upper}}"
    